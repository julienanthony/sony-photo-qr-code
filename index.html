<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Sony A7III</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f5f5f5;
      padding-top: 60px;
      margin: 0;
    }

    h1 {
      color: #222;
      margin-bottom: 40px;
    }

    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 20px 40px;
      font-size: 22px;
      border-radius: 12px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <h1>Appuyez pour prendre une photo</h1>

  <button onclick="prendrePhoto()">
    Prendre la photo
  </button>

  <script>
    function prendrePhoto() {
      alert("Signal envoyé pour prendre la photo !");
    }
  </script>

</body>
</html>
